<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Camera</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <script type="module" src="camera.js"></script>
  </head>
  <body>
    <main class="camera-app">
      <header class="site-header">
        <a href="../../">Apps</a>
        <h1>Camera</h1>
      </header>
      <div class="viewfinder">
        <video id="preview" autoplay muted playsinline aria-label="Camera preview"></video>
        <button id="start" class="start-camera" type="button">Start camera</button>
      </div>
      <div class="controls" aria-label="Camera controls">
        <button id="photo" type="button" disabled>Photo</button>
        <button id="record" type="button" aria-pressed="false" disabled>Record</button>
        <button id="flip" type="button" aria-label="Next camera" disabled><img src="../../shared/icons/user.svg" alt="" hidden><span data-camera-label>x1</span></button>
        <button id="stop" type="button" disabled>Close</button>
      </div>
      <p id="status" class="status" role="status" hidden></p>
      <section id="capture" class="capture" aria-label="Capture" hidden>
        <img id="image" alt="Captured photo" hidden>
        <video id="recording" controls playsinline hidden></video>
        <div class="controls">
          <a id="save" class="button" download>Save</a>
          <button id="share" type="button" hidden>Share</button>
          <button id="clear" type="button">Clear</button>
        </div>
      </section>
    </main>
  </body>
</html>
