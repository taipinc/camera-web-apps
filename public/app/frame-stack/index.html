<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Frame stack</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <link rel="stylesheet" href="../../shared/controls.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
    </script>
    <script type="module" src="frame-stack.js"></script>
  </head>
  <body>
    <main class="stack-app">
      <header class="site-header"><a href="../../">Apps</a><h1>Frame stack</h1></header>
      <div class="sticky-view">
        <div id="stage" class="stack-stage" aria-label="3D frame stack. One finger rotates; two fingers pan and pinch to zoom."><output id="count" class="frame-count" hidden>0 / 120 frames</output></div>

      </div>
      <video id="preview" class="camera-source" autoplay muted playsinline aria-hidden="true"></video>
      <div class="controls capture-controls" aria-label="Capture controls">
        <button id="capture" class="circle-button capture-button" data-state="start" type="button" aria-label="Start camera" title="Start camera" aria-pressed="false" disabled><img src="../../shared/icons/power.svg" alt=""><span class="record-dot" aria-hidden="true" hidden></span></button>
        <button id="fps" class="circle-button cycle-button" type="button" value="30" data-cycle-values="1 3 6 12 24 30" data-cycle-label="fps" aria-label="30 fps. Click to change" title="Change FPS"><span data-cycle-value>30</span><small>fps</small></button>
        <button id="duration" class="circle-button cycle-button" type="button" value="4" data-cycle-values="4 6 8 10 12" data-cycle-label="sec" aria-label="4 sec. Click to change" title="Change capture duration"><span data-cycle-value>4</span><small>sec</small></button>
        <button id="flip" class="circle-button" type="button" aria-label="Flip camera" title="Flip camera" disabled><img src="../../shared/icons/refresh-cw.svg" alt=""></button>
        <button id="clear" class="circle-button" type="button" aria-label="Clear frames" title="Clear frames" disabled><img src="../../shared/icons/broom-sparkles.svg" alt=""></button>
        <button id="reset" class="circle-button" type="button" aria-label="Front view" title="Front view" disabled><img src="../../shared/icons/move-3d.svg" alt=""></button>
      </div>
      <section id="dissection" class="dissection" aria-label="Dissect">
        <div class="dissection-toolbar">
          <div class="mode-control" role="group" aria-label="Slicer">
            <label class="switch-control"><input id="slicer-enabled" type="checkbox" role="switch" disabled><span class="switch-track" aria-hidden="true"></span><span>Slicer</span></label>
          </div>
          <div id="slice-types" class="tab-list" hidden role="tablist" aria-label="Slicer type">
            <button id="plane-tab" type="button" role="tab" data-mode="plane" aria-selected="true" aria-controls="slice-panel" disabled>Plane</button>
            <button id="terrain-tab" type="button" role="tab" data-mode="terrain" aria-selected="false" aria-controls="slice-panel" tabindex="-1" disabled>Topography</button>
          </div>
          <label class="guide-control" data-slicer="plane terrain" hidden><input id="show-surface" type="checkbox" disabled> Show surface</label>
        </div>
        <div class="dial-bank rewind-controls">
          <div class="dial"><label for="rewind">Hide recent</label><output id="rewind-value">0 frames</output><input id="rewind" type="range" min="0" max="0" step="1" value="0" disabled></div>
        </div>
        <div class="tabs">
          <div id="slice-panel" class="tab-panel" data-slicer="plane terrain" hidden role="tabpanel" aria-labelledby="plane-tab">
            <div class="dial-bank">
              <div class="dial" data-slicer="plane terrain" hidden><label for="depth">Depth</label><output id="depth-value">50%</output><input id="depth" type="range" min="0" max="100" value="50" step="0.1" disabled></div>
              <div class="dial" data-slicer="plane" hidden><label for="tilt-x">Rotation X</label><output id="tilt-x-value">0°</output><input id="tilt-x" type="range" min="-180" max="180" value="0" disabled></div>
              <div class="dial" data-slicer="plane" hidden><label for="tilt-y">Rotation Y</label><output id="tilt-y-value">0°</output><input id="tilt-y" type="range" min="-180" max="180" value="0" disabled></div>
              <div class="dial" data-slicer="plane" hidden><label for="tilt-z">Rotation Z</label><output id="tilt-z-value">0°</output><input id="tilt-z" type="range" min="-180" max="180" value="0" disabled></div>
              <div class="dial" data-slicer="terrain" hidden><label for="noise-amount">Noise height</label><output id="noise-amount-value">50%</output><input id="noise-amount" type="range" min="0" max="100" value="50" disabled></div>
              <div class="dial" data-slicer="terrain" hidden><label for="noise-scale">Noise detail</label><output id="noise-scale-value">3</output><input id="noise-scale" type="range" min="0.1" max="5" value="3" step="0.1" disabled></div>
              <div class="dial" data-slicer="terrain" hidden><label for="noise-seed">Noise variation</label><output id="noise-seed-value">0</output><input id="noise-seed" type="range" min="0" max="20" value="0" step="0.01" disabled></div>
            </div>
          </div>
        </div>
      </section>
      <p id="status" class="status" role="status">Loading 3D view…</p>
    </main>
  </body>
</html>
