<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Slit camera</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <link rel="stylesheet" href="../../shared/controls.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="slit-camera.js"></script>
  </head>
  <body>
    <main class="slit-app">
      <header class="site-header"><a href="../../">Apps</a><h1>Slit camera</h1></header>
      <div class="stage">
        <video id="preview" autoplay muted playsinline aria-label="Camera preview"></video>
        <canvas id="image" width="1" height="1" aria-label="Slit image, one sampled column per captured frame" hidden></canvas>
        <output id="count" class="frame-count" hidden>0 / 120 frames</output>
      </div>
      <section class="controls" aria-label="Capture controls">
        <button id="capture" class="circle-button capture-button" data-state="start" type="button" aria-label="Start camera" title="Start camera" aria-pressed="false"><img src="../../shared/icons/power.svg" alt=""><span class="record-dot" aria-hidden="true" hidden></span></button>
        <button id="fps" class="circle-button cycle-button" type="button" value="30" data-cycle-values="1 3 6 12 24 30 48 60" data-cycle-label="fps" aria-label="30 fps. Click to change" title="Change FPS"><span data-cycle-value>30</span><small>fps</small></button>
        <button id="duration" class="circle-button cycle-button" type="button" value="4" data-cycle-values="4 6 8 10 12 16 20 30" data-cycle-label="sec" aria-label="4 sec. Click to change" title="Change capture duration"><span data-cycle-value>4</span><small>sec</small></button>
        <button id="flip" class="circle-button" type="button" aria-label="Next camera" title="Next camera" disabled><img src="../../shared/icons/user.svg" alt="" hidden><span data-camera-label>x1</span></button>
        <button id="clear" class="circle-button" type="button" aria-label="Clear frames" title="Clear frames" disabled><img src="../../shared/icons/broom-sparkles.svg" alt=""></button>
      </section>
      <section id="editing" class="editing-controls" aria-label="Image editing" hidden>
        <div id="column-dial" class="dial" hidden><label for="column">Column</label><output id="column-value">50%</output><input id="column" type="range" min="0" max="100" step="0.1" value="50" disabled></div>
        <div id="sweep-dial" class="dial" hidden><label for="sweep">Sweep</label><output id="sweep-value">50%</output><input id="sweep" type="range" min="0" max="100" step="0.1" value="50" disabled></div>
        <div id="amplitude-dial" class="dial" hidden><label for="amplitude">Amplitude</label><output id="amplitude-value">0%</output><input id="amplitude" type="range" min="0" max="100" step="0.1" value="0" disabled></div>
        <div id="frequency-dial" class="dial" hidden><label for="frequency">Frequency</label><output id="frequency-value">1 cycle</output><input id="frequency" type="range" min="1" max="10" step="1" value="1" disabled></div>
      </section>
      <p id="status" class="status" role="status" hidden></p>
    </main>
  </body>
</html>
